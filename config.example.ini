; ChargeGuard 配置示例。
; 用法：退出 ChargeGuard 后，复制为 %APPDATA%\ChargeGuard\config.ini，
; 再按需修改下面的值。Mode=Monitor 时两个 URL 不会生效。

[ChargeGuard]
Limit=80
Resume=75
Mode=Monitor
PlugOnUrl=http://192.0.2.50/cm?cmnd=Power%20On
PlugOffUrl=http://192.0.2.50/cm?cmnd=Power%20Off
Autostart=False
Notifications=True
RestoreOnExit=True
Override=False
PlugOff=False
